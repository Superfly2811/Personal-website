<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Logg inn</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, Segoe UI, Roboto, Helvetica, Arial;
  background: #f5f5f3;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px;
  color: #1a1a1a;
}
.card {
  background: #fff;
  border: 0.5px solid #e0e0e0;
  border-radius: 16px;
  padding: 2.5rem;
  width: 100%;
  max-width: 360px;
}
h1 { font-size: 20px; font-weight: 500; margin-bottom: 0.3rem; }
.sub { font-size: 13px; color: #888; margin-bottom: 2rem; }
label { display: block; font-size: 12px; color: #666; margin-bottom: 5px; }
input {
  width: 100%;
  padding: 9px 12px;
  font-size: 14px;
  border: 0.5px solid #ccc;
  border-radius: 8px;
  outline: none;
  background: #fafaf9;
  color: #1a1a1a;
  margin-bottom: 1.1rem;
  transition: border-color 0.2s, box-shadow 0.2s;
}
input:focus { border-color: #999; box-shadow: 0 0 0 3px rgba(0,0,0,0.06); }
button {
  width: 100%;
  padding: 9px;
  font-size: 14px;
  background: #1a1a1a;
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.2s;
}
button:hover { background: #333; }
button:disabled { background: #ccc; cursor: not-allowed; }
.error {
  font-size: 12px;
  color: #c0392b;
  background: #FCEBEB;
  border-radius: 8px;
  padding: 8px 12px;
  margin-top: 1rem;
  display: none;
}
</style>
</head>
<body>
<div class="card">
  <h1>Logg inn</h1>
  <p class="sub">Skriv inn brukernavn og passord for å fortsette</p>

  <label for="username">Brukernavn</label>
  <input type="text" id="username" placeholder="brukernavn" autocomplete="username" />

  <label for="password">Passord</label>
  <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />

  <button id="btn" onclick="login()">Logg inn</button>
  <div class="error" id="err"></div>
</div>

<script>
document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

async function login() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');

  err.style.display = 'none';
  if (!username || !password) {
    err.textContent = 'Fyll inn brukernavn og passord';
    err.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Logger inn…';

  try {
    const res = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (data.success) {
      window.location.href = data.redirect;
    } else {
      err.textContent = data.error || 'Innlogging feilet';
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Logg inn';
    }
  } catch {
    err.textContent = 'Noe gikk galt, prøv igjen';
    err.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Logg inn';
  }
}
</script>
</body>
</html>
